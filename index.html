  saveStock();
  renderStock();
}

// 월별 통계 수당/휴무/강휴 override 데이터
const statOverride={};

function toggleStatOverride(dk, currentStatus){
  const cycle={allow:'off', 'allow-no':'off', off:'mandatory', mandatory:'allow'};
  const next=cycle[currentStatus]||'off';
  if(next==='allow'&&currentStatus==='mandatory'){
    statOverride[dk]='allow';
  } else if(next==='off'){
    statOverride[dk]='off';
  } else if(next==='mandatory'){
    statOverride[dk]='mandatory';
  } else {
    delete statOverride[dk];
  }
  try{ localStorage.setItem('근무표_override', JSON.stringify(statOverride)); } catch(e){}
  renderMonthlyStats();
  renderAnnual();
  renderCalendar();
}

function loadOverride(){
  try{
    const ov=JSON.parse(localStorage.getItem('근무표_override')||'{}');
    Object.keys(ov).forEach(k=>{ statOverride[k]=ov[k]; });
  } catch(e){}
}

// ─── 재고 현황 ───
const REPAIR_SIZES=[90,95,100,105,110,115,120];
const SUIT_SIZE_EN={90:'M',95:'L',100:'XL',105:'2XL',110:'3XL',115:'4XL',120:'5XL'};
const SHOE_SIZES=[230,235,240,245,250,255,260,265,270,275,280,285,290,295,300];
let repairData={};
let repairModalDateKey=null;
let repairCat='suit'; // 'suit'=방한복 | 'shoe'=방한화

function setRepairCat(cat){
  repairCat=cat;
  ['suit','shoe'].forEach(c=>{
    const btn=document.getElementById('catBtn_'+c);
    if(!btn) return;
    const active=c===cat;
    btn.style.background=active?'var(--accent)':'var(--white)';
    btn.style.color=active?'#fff':'var(--text-muted)';
    btn.style.borderColor=active?'var(--accent)':'var(--border)';
  });
  renderRepairModal();
}

function loadRepair(){
  try{ repairData=JSON.parse(localStorage.getItem('근무표_수선')||'{}'); }
  catch(e){ repairData={}; }
}
function saveRepair(){
  try{ localStorage.setItem('근무표_수선',JSON.stringify(repairData)); } catch(e){}
}

function openRepairNew(){
  const today=new Date();
  const yyyy=today.getFullYear();
  const mm=String(today.getMonth()+1).padStart(2,'0');
  const dd=String(today.getDate()).padStart(2,'0');
  document.getElementById('repairModalDate').value=`${yyyy}-${mm}-${dd}`;
  repairModalDateKey=`${yyyy}-${mm}-${dd}`;
  const modal=document.getElementById('repairModal');
  modal.style.display='flex';
  repairCat='suit';
  setRepairCat('suit');

  document.getElementById('repairModalDate').oninput=function(){
    repairModalDateKey=this.value;
    renderRepairModal();
  };
}

function closeRepairModal(){
  document.getElementById('repairModal').style.display='none';
  repairModalDateKey=null;
  renderRepair();
}

function changeRepairCount(size, delta){
  if(!repairModalDateKey) return;
  if(!repairData[repairModalDateKey]) repairData[repairModalDateKey]={};
  const key=`${repairCat}_${size}`;
  const cur=repairData[repairModalDateKey][key]||0;
  repairData[repairModalDateKey][key]=Math.max(0,cur+delta);
  saveRepair();
  renderRepairModal();
}

function renderRepairModal(){
  const k=repairModalDateKey;
  const dayData=(k&&repairData[k])||{};
  const sizes=repairCat==='suit'?REPAIR_SIZES:SHOE_SIZES;
  const unit=repairCat==='suit'?'벌':'켤레';
  const label=repairCat==='suit'?'방한복':'방한화';

  let total=0;
  sizes.forEach(s=>{ total+=(dayData[`${repairCat}_${s}`]||0); });
  const sumBtn=document.getElementById('stockSummaryBtn');
  if(sumBtn) sumBtn.style.display=Object.values(dayData).some(v=>v>0)?'inline-block':'none';

  const content=document.getElementById('repairModalContent');
  if(!content) return;

  let html=`<div style="margin-bottom:10px;text-align:center;font-size:0.78rem;color:var(--text-muted);">
    ${label} 총 <strong style="font-size:1rem;color:var(--accent);">${total}</strong> ${unit}
  </div>`;

  sizes.forEach(size=>{
    const key=`${repairCat}_${size}`;
    const qty=dayData[key]||0;
    html+=`<div style="display:flex;align-items:center;background:var(--white);
      border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px;gap:8px;">
      <div style="font-size:1rem;font-weight:800;color:var(--text);min-width:40px;line-height:1.1;text-align:center;">${size}${repairCat==='suit'&&SUIT_SIZE_EN[size]?`<div style="font-size:0.66rem;font-weight:700;color:var(--text-muted);">${SUIT_SIZE_EN[size]}</div>`:''}</div>
      <div style="font-size:1.2rem;font-weight:900;color:${qty>0?'var(--accent)':'#c9cabd'};min-width:36px;text-align:center;">${qty}</div>
      <div style="display:flex;gap:5px;flex:1;justify-content:flex-end;flex-wrap:wrap;">
        <button ontouchstart="changeRepairCount(${size},-10)" onclick="changeRepairCount(${size},-10)"
          style="padding:6px 8px;border-radius:8px;border:1px solid #ebc9c3;background:#fbf0ee;
          font-size:0.72rem;font-weight:700;color:#c27a72;cursor:pointer;">−10</button>
        <button ontouchstart="changeRepairCount(${size},-5)" onclick="changeRepairCount(${size},-5)"
          style="padding:6px 8px;border-radius:8px;border:1px solid #ebc9c3;background:#fbf0ee;
          font-size:0.72rem;font-weight:700;color:#c27a72;cursor:pointer;">−5</button>
        <button ontouchstart="changeRepairCount(${size},-1)" onclick="changeRepairCount(${size},-1)"
          style="padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);
          font-size:0.72rem;font-weight:700;color:var(--text);cursor:pointer;">−1</button>
        <button ontouchstart="changeRepairCount(${size},1)" onclick="changeRepairCount(${size},1)"
          style="padding:6px 8px;border-radius:8px;border:1px solid #c9d6ba;background:#eef3e7;
          font-size:0.72rem;font-weight:700;color:#6f8a5c;cursor:pointer;">+1</button>
        <button ontouchstart="changeRepairCount(${size},5)" onclick="changeRepairCount(${size},5)"
          style="padding:6px 8px;border-radius:8px;border:1px solid #c9d6ba;background:#eef3e7;
          font-size:0.72rem;font-weight:700;color:#6f8a5c;cursor:pointer;">+5</button>
        <button ontouchstart="changeRepairCount(${size},10)" onclick="changeRepairCount(${size},10)"
          style="padding:6px 8px;border-radius:8px;border:1px solid #c9d6ba;background:#eef3e7;
          font-size:0.72rem;font-weight:700;color:#6f8a5c;cursor:pointer;">+10</button>
      </div>
    </div>`;
  });

  content.innerHTML=html;
}

function renderRepair(){
  loadRepair();
  const content=document.getElementById('repairContent');
  if(!content) return;
  const allDates=Object.keys(repairData).sort().reverse()
    .filter(dt=>{
      const dd=repairData[dt];
      let tot=0;
      REPAIR_SIZES.forEach(s=>{ tot+=(dd[`suit_${s}`]||0); });
      SHOE_SIZES.forEach(s=>{ tot+=(dd[`shoe_${s}`]||0); });
      return tot>0;
    });

  if(!allDates.length){
    content.innerHTML=`<div class="no-data" style="margin-top:24px;">기록이 없습니다.<br><span style="font-size:0.75rem;">우측 하단 + 버튼으로 추가하세요</span></div>`;
    return;
  }

  let html='';
  allDates.forEach(dt=>{
    const dd=repairData[dt];
    let suitTotal=0, shoeTotal=0;
    REPAIR_SIZES.forEach(s=>{ suitTotal+=(dd[`suit_${s}`]||0); });
    SHOE_SIZES.forEach(s=>{ shoeTotal+=(dd[`shoe_${s}`]||0); });
    const parts=[];
    if(suitTotal>0) parts.push(`🧥 ${suitTotal}벌`);
    if(shoeTotal>0) parts.push(`👢 ${shoeTotal}켤레`);
    html+=`
    <div class="repair-swipe-wrap" style="position:relative;overflow:hidden;border-radius:12px;margin-bottom:8px;">
      <div class="repair-delete-bg" style="position:absolute;right:0;top:0;bottom:0;width:80px;
        background:#c27a72;border-radius:12px;display:flex;align-items:center;justify-content:center;">
        <span style="color:#fff;font-size:0.78rem;font-weight:700;">삭제</span>
      </div>
      <div class="repair-item" data-dt="${dt}"
        style="position:relative;background:var(--white);border:1px solid var(--border);border-radius:12px;
        padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
        transition:transform 0.2s ease;z-index:1;">
        <div>
          <div style="font-size:0.82rem;font-weight:700;color:var(--text);">${dt}</div>
          <div style="font-size:0.68rem;color:var(--text-muted);margin-top:2px;">${parts.join('  ') || '-'}</div>
        </div>
        <div style="font-size:0.9rem;font-weight:800;color:var(--accent);">›</div>
      </div>
    </div>`;
  });
  content.innerHTML=html;

  // 스와이프 삭제 이벤트 - passive:false로 스크롤 차단
  content.querySelectorAll('.repair-item').forEach(item=>{
    let startX=0, startY=0, curX=0, swiping=false, decided=false;
    const dt=item.dataset.dt;

    item.addEventListener('touchstart',e=>{
      startX=e.touches[0].clientX;
      startY=e.touches[0].clientY;
      curX=0; swiping=false; decided=false;
      item.style.transition='none';
    },{passive:true});

    item.addEventListener('touchmove',e=>{
      const dx=e.touches[0].clientX-startX;
      const dy=e.touches[0].clientY-startY;
      if(!decided){
        if(Math.abs(dx)<5&&Math.abs(dy)<5) return;
        decided=true;
        swiping=Math.abs(dx)>Math.abs(dy)&&dx<0;
      }
      if(!swiping) return;
      e.preventDefault();
      curX=Math.max(dx,-90);
      if(curX>0) curX=0;
      item.style.transform=`translateX(${curX}px)`;
    },{passive:false});

    item.addEventListener('touchend',()=>{
      item.style.transition='transform 0.22s ease';
      if(swiping&&curX<-50){
        item.style.transform='translateX(-110%)';
        setTimeout(()=>{ delete repairData[dt]; saveRepair(); renderRepair(); },220);
      } else if(!swiping&&Math.abs(curX)<5){
        item.style.transform='translateX(0)';
        openRepairEdit(dt);
      } else {
        item.style.transform='translateX(0)';
      }
    });
  });
}

// ── 재고 요약본: 지금 열린 날짜 기준, 0개인 사이즈는 제외 ──
function openStockSummary(){
  const dt=repairModalDateKey;
  const dd=dt&&repairData[dt];
  if(!dd) return;
  const [yy,mm,ddd]=dt.split('-').map(Number);
  const dow='일월화수목금토'[new Date(yy,mm-1,ddd).getDay()];
  const sec=(label,cat,sizes,unit)=>{
    const rows=sizes.map(s=>({s,q:dd[`${cat}_${s}`]||0})).filter(r=>r.q>0);
    if(!rows.length) return {html:'',total:0};
    const total=rows.reduce((a,r)=>a+r.q,0);
    let h=`<div class="ssum-sec"><div class="ssum-sec-head"><span class="ssum-sec-name">${label}</span><span class="ssum-sec-total">${total}${unit}</span></div>`;
    // 가로줄 목록을 2단으로 (위→아래, 왼→오) — 사이즈와 개수 간격을 좁게 유지
    const per=Math.ceil(rows.length/2);
    h+=`<div class="ssum-list" style="grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(${per},auto);">`;
    rows.forEach(r=>{ const en=cat==='suit'&&SUIT_SIZE_EN[r.s]?`<small>(${SUIT_SIZE_EN[r.s]})</small>`:'';
      h+=`<div class="ssum-row"><span class="ssum-size">${r.s}${en}</span><span class="ssum-qty">${r.q}<small>${unit}</small></span></div>`; });
    return {html:h+`</div></div>`,total};
  };
  const suit=sec('방한복','suit',REPAIR_SIZES,'벌');
  const shoe=sec('방한화','shoe',SHOE_SIZES,'켤레');
  const foot=[]; if(suit.total) foot.push(`방한복 ${suit.total}벌`); if(shoe.total) foot.push(`방한화 ${shoe.total}켤레`);
  document.getElementById('stockSummaryCard').innerHTML=
    `<div class="ssum-head"><div class="ssum-title">방한복 · 방한화 재고</div>
      <div class="ssum-date">${yy}년 ${mm}월 ${ddd}일 (${dow})</div></div>`
    +suit.html+shoe.html
    +`<div class="ssum-foot"><span>합계</span><span>${foot.join(' · ')}</span></div>`;
  document.getElementById('stockSummary').style.display='flex';
}
function closeStockSummary(){
  document.getElementById('stockSummary').style.display='none';
}

function openRepairEdit(dt){
  document.getElementById('repairModalDate').value=dt;

// ─── 스와이프로 월 이동 ───
(function(){
  const el=document.getElementById('view-calendar');
  let startX=0,startY=0,startTime=0;
  el.addEventListener('touchstart',e=>{
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
    startTime=Date.now();
  },{passive:true});
  el.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    const dt=Date.now()-startTime;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>60&&dt>100){
      const grid=document.getElementById('calendarGrid');
      const dir=dx<0?1:-1;
      grid.style.transition='transform 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.35s ease';
      grid.style.opacity='0';
      grid.style.transform=`translateX(${dir*-80}px)`;
      setTimeout(()=>{
        grid.style.transition='none';
        grid.style.opacity='0';
        grid.style.transform=`translateX(${dir*80}px)`;
        changeMonth(dir);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          grid.style.transition='transform 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease';
          grid.style.opacity='1';
          grid.style.transform='translateX(0)';
        }));
      },350);
    }
  },{passive:true});
})();
// ─── 드래그 앤 드롭 근무 변경 ───
(function(){
  let dragState=null;
  let longPressTimer=null;
  let lastHighlight=null;
  let isDragging=false;

  document.addEventListener('selectstart',function(e){
    if(isDragging||longPressTimer) e.preventDefault();
  });

  function getDayCell(el){ return el.closest('.day-cell:not(.other-month)'); }

  function getCellDate(cell){
    const num=cell.querySelector('.d-num');
    if(!num) return null;
    return {y:currentYear,m:currentMonth,d:parseInt(num.textContent)};
  }

  function createGhost(label,wkey,tx,ty){
    const ghost=document.createElement('div');
    const bg=wkey==='lee'?'#9db487':wkey==='hong'?'#b3a2d6':'#7f9cbb';
    ghost.style.position='fixed';
    ghost.style.top=(ty-20)+'px';
    ghost.style.left=(tx-40)+'px';
    ghost.style.padding='6px 14px';
    ghost.style.borderRadius='8px';
    ghost.style.background=bg;
    ghost.style.color='#fff';
    ghost.style.fontSize='0.85rem';
    ghost.style.fontWeight='700';
    ghost.style.pointerEvents='none';
    ghost.style.zIndex='9999';
    ghost.style.boxShadow='0 6px 20px rgba(0,0,0,0.4)';
    ghost.style.fontFamily="'Noto Sans KR',sans-serif";
    ghost.style.whiteSpace='nowrap';
    ghost.textContent=label;
    document.body.appendChild(ghost);
    return ghost;
  }

  function clearHighlight(){
    if(lastHighlight){ lastHighlight.style.outline=''; lastHighlight.style.background=''; lastHighlight=null; }
  }

  function highlightCell(cell){
    clearHighlight();
    cell.style.outline='2.5px solid #9cc5a8';
    cell.style.background='rgba(156,197,168,0.18)';
    lastHighlight=cell;
  }

  // ── 실제 상태 판단 헬퍼 ──────────────────────────────────────
  function getActualState(y,m,d,wkey){
    const k=dateKey(y,m,d);
    const dow=new Date(y,m,d).getDay();
    const sd=swapData[k]||null;
    const ld=leaveData[k];
    const rr=getRec(y,m,d,wkey);
    if(rr==='l') return 'leave';
    if(rr==='o'||rr==='x') return 'off';
    if(rr==='w') return 'work';
    if(ld&&ld.has(wkey)) return 'leave';
    if(wkey==='lee'){
      if(sd&&sd.leeOff) return 'off';
      if(sd&&sd.from==='lee') return 'off';
      if(sd&&(sd.leeWork||sd.to==='lee')) return 'work';
      return (!isFriday(dow,y,m,d)&&getSchedule(y,m,d).find(w=>w.key==='lee').offDays.includes(dow)) ? 'off' : 'work';
    } else {
      if(sd&&sd.from===wkey) return 'off';
      if(sd&&sd.to===wkey) return sd.toState==='off'?'off':'work';
      return getWorkers(y,m,d).some(w=>w.key===wkey) ? 'work' : 'off';
    }
  }

  document.addEventListener('touchstart',function(e){
    const btn=e.target.closest('.drag-swap-btn');
    if(!btn) return;
    const wkey=btn.dataset.wkey;
    if(!wkey) return;
    const touch=e.touches[0];

    longPressTimer=setTimeout(()=>{
      isDragging=true;
      window.getSelection&&window.getSelection().removeAllRanges();
      document.getElementById('leaveModal').classList.remove('open');

      const fromState=getActualState(modalY,modalM,modalD,wkey);
      const fromIsOff=(fromState==='off');

      // 출발 셀 테두리 강조
      const fk=dateKey(modalY,modalM,modalD);
      const fromCell=document.querySelector(`.day-cell[data-key="${fk}"]`);
      if(fromCell){ fromCell.style.outline='3px solid #d4b46a'; fromCell.style.background='rgba(212,180,106,0.12)'; }

      const ghost=createGhost(NAME_MAP[wkey],wkey,touch.clientX,touch.clientY);
      dragState={fromY:modalY,fromM:modalM,fromD:modalD,fromW:wkey,fromIsOff,ghost,fromCell:fromCell||null};
    },400);
  },{passive:true});

  let monthSwitchTimer=null;
  function clearMonthSwitchTimer(){ if(monthSwitchTimer){ clearTimeout(monthSwitchTimer); monthSwitchTimer=null; } }

  function clearFromCellHighlight(){
    if(dragState&&dragState.fromCell){
      dragState.fromCell.style.outline='';
      dragState.fromCell.style.background='';
    }
  }

  document.addEventListener('touchmove',function(e){
    if(!dragState) return;
    e.preventDefault();
    const touch=e.touches[0];
    dragState.ghost.style.left=(touch.clientX-40)+'px';
    dragState.ghost.style.top=(touch.clientY-20)+'px';
    dragState.ghost.style.display='none';
    const under=document.elementFromPoint(touch.clientX,touch.clientY);
    dragState.ghost.style.display='';

    // ◀▶ 버튼 위에 머물면 월 전환
    const navBtn=under ? under.closest('[data-dir]') : null;
    if(navBtn){
      if(!monthSwitchTimer){
        const dir=parseInt(navBtn.dataset.dir||'0',10);
        if(dir!==0){
          monthSwitchTimer=setTimeout(()=>{
            changeMonth(dir);
            monthSwitchTimer=null;
          },600);
        }
      }
    } else {
      clearMonthSwitchTimer();
    }

    const cell=getDayCell(under);
    if(cell){ const date=getCellDate(cell); if(date&&!(date.y===dragState.fromY&&date.m===dragState.fromM&&date.d===dragState.fromD)){ highlightCell(cell); return; } }
    clearHighlight();
  },{passive:false});

  document.addEventListener('touchend',function(e){
    if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
    clearMonthSwitchTimer();
    if(!dragState){ isDragging=false; return; }
    const touch=e.changedTouches[0];
    dragState.ghost.style.display='none';
    const under=document.elementFromPoint(touch.clientX,touch.clientY);
    dragState.ghost.remove();
    clearHighlight();
    clearFromCellHighlight();
    isDragging=false;
    const {fromY,fromM,fromD,fromW,fromIsOff}=dragState;
    dragState=null;
    if(under){
      const cell=getDayCell(under);
      if(cell){
        const date=getCellDate(cell);
        if(date&&!(date.y===fromY&&date.m===fromM&&date.d===fromD)){
          openSwapTargetModal(date.y,date.m,date.d,fromW,fromIsOff);
        }
      }
    }
  });

  // 공휴일명 글자 크기 자동 맞춤
  // 공휴일명은 HTML 생성 시 글자 수 기반 font-size 인라인 지정

  window.confirmDragSwap=function(){
    if(!window._pendingSwap) return;
    const {fromY,fromM,fromD,fromW,toY,toM,toD,toW}=window._pendingSwap;
    const fromKey=dateKey(fromY,fromM,fromD);
    const toKey=dateKey(toY,toM,toD);

    // 교환 전 각자의 실제 상태 파악
    const fromState=getActualState(fromY,fromM,fromD,fromW);
    const toState=getActualState(toY,toM,toD,toW);

    if(swapData[fromKey]) cancelSwapSilent(fromKey);
    if(swapData[toKey]) cancelSwapSilent(toKey);
    const color=getSwapColor();

    // 등가교환: fromW와 toW의 상태를 서로 맞바꿈
    // fromKey: fromW빠짐(fromState), toW들어옴(toState로 표시)
    // toKey:   toW빠짐(toState),   fromW들어옴(fromState로 표시)
    swapData[fromKey]={from:fromW,fromState,to:toW,toState,pairDate:toKey,color};
    swapData[toKey]={from:toW,fromState:toState,to:fromW,toState:fromState,pairDate:fromKey,color};

    saveData(); renderCalendar();
    ['view-monthly','view-annual','view-leave'].forEach(id=>{
      const el=document.getElementById(id);
      if(el&&!el.classList.contains('view-hidden')){
        if(id==='view-monthly') renderMonthlyStats();
        else if(id==='view-annual') renderAnnual();
        else renderLeaveStats();
      }
    });
    document.getElementById('dragConfirmModal').style.display='none';
    window._pendingSwap=null;
  };

  window.cancelDragSwap=function(){
    document.getElementById('dragConfirmModal').style.display='none';
    window._pendingSwap=null;
  };
})();
</script>
</body>
</html>
